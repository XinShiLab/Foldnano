name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The bundled cadnano2_5_mini plugin wheel and the doc-site screenshots are stored with Git LFS.
          lfs: true

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Prettier, ESLint, docs:verify)
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Tests
        run: pnpm test:all

      - name: Build
        run: pnpm build

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/lib/plugin/python/uv.lock

      # uv reads src/lib/plugin/python/.python-version (the pinned Pyodide's Python).
      - name: Python plugin tests
        run: pnpm test:python
